{% extends "base.html" %}{% block title %}Вход{% endblock %}
{% block body %}
<div class="top"><h1>Парсер Telegram</h1></div>
<div class="card">
  <h2>Вход</h2>
  <p class="hint">Доступ по общему паролю команды.</p>
  {% if error %}<div class="msg bad">{{ error }}</div>{% endif %}
  <form method="post" action="{{ base }}/login">
    <div class="row"><label for="p">Пароль</label>
      <input id="p" name="password" type="password" autocomplete="current-password" autofocus required></div>
    <button type="submit">Войти</button>
  </form>
</div>
{% endblock %}
