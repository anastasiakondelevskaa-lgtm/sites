<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{% block title %}Парсер Telegram{% endblock %}</title>
<style>
:root{
  --bg:#f4f5f7; --card:#fff; --ink:#171b21; --ink2:#4d5763; --muted:#78828f;
  --rule:#dfe3e9; --accent:#2c6fb5; --accent-ink:#1f5590;
  --bad:#a33d28; --bad-bg:#fbeee9; --ok:#2c6b4c; --ok-bg:#e7f2ec;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#12151a; --card:#191d24; --ink:#e7ebf1; --ink2:#bcc5d1; --muted:#8a94a2;
  --rule:#282f39; --accent:#78b0e8; --accent-ink:#a5cdf3;
  --bad:#e08f72; --bad-bg:#2a1c17; --ok:#7cc6a0; --ok-bg:#152420;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:660px;margin:0 auto;padding:28px 16px 64px}
h1{font-size:21px;margin:0;letter-spacing:-.01em}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:20px;margin-bottom:16px}
.card h2{font-size:16px;margin:0 0 4px}
.hint{color:var(--muted);font-size:13px;margin:0 0 16px}
label{display:block;font-size:13px;color:var(--ink2);margin:0 0 5px;font-weight:500}
input,select{width:100%;max-width:100%;padding:10px 12px;font:inherit;font-size:16px;
  color:var(--ink);background:var(--bg);border:1px solid var(--rule);border-radius:6px}
select{text-overflow:ellipsis}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.row{margin-bottom:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.two{grid-template-columns:1fr}}
button{font:inherit;font-weight:600;padding:11px 18px;border-radius:6px;border:1px solid var(--accent);
  background:var(--accent);color:#fff;cursor:pointer}
button:hover{background:var(--accent-ink);border-color:var(--accent-ink)}
button.ghost{background:transparent;color:var(--ink2);border-color:var(--rule);font-weight:500;padding:7px 12px}
button:disabled{opacity:.55;cursor:default}
.msg{padding:11px 14px;border-radius:6px;font-size:14px;margin-bottom:16px}
.msg.bad{background:var(--bad-bg);color:var(--bad)}
.msg.ok{background:var(--ok-bg);color:var(--ok)}
.who{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--ink2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.9em;
  background:var(--bg);padding:1px 5px;border-radius:3px}
a{color:var(--accent-ink)}
.stat{display:flex;gap:22px;flex-wrap:wrap;margin:14px 0 0;font-variant-numeric:tabular-nums}
.stat div{font-size:13px;color:var(--muted)}
.stat b{display:block;font-size:22px;color:var(--ink);font-weight:600}
.bar{height:3px;background:var(--rule);border-radius:2px;overflow:hidden;margin-top:14px}
.bar i{display:block;height:100%;width:35%;background:var(--accent);animation:run 1.3s ease-in-out infinite}
@keyframes run{0%{margin-left:-35%}100%{margin-left:100%}}
@media (prefers-reduced-motion:reduce){.bar i{animation:none;width:100%}}
footer{color:var(--muted);font-size:12.5px;margin-top:26px;text-align:center}
details{border:1px solid var(--rule);border-radius:6px;margin:0 0 16px;background:var(--bg)}
details summary{cursor:pointer;padding:11px 14px;font-size:13.5px;font-weight:500;color:var(--accent-ink);
  list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"›";display:inline-block;margin-right:8px;transition:transform .15s;color:var(--muted)}
details[open] summary::before{transform:rotate(90deg)}
details summary:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:6px}
.steps{margin:0;padding:0 16px 14px 34px;color:var(--ink2);font-size:14px}
.steps li{margin-bottom:9px}
.steps li:last-child{margin-bottom:0}
.warn{margin:10px 16px 14px;padding:10px 12px;border-radius:5px;background:var(--bad-bg);
  color:var(--bad);font-size:13px}
@media (prefers-reduced-motion:reduce){details summary::before{transition:none}}
.tabs{display:flex;gap:6px;margin:0 0 14px}
.tabs button{background:transparent;color:var(--ink2);border:1px solid var(--rule);font-weight:500;padding:7px 14px}
.tabs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.tools{display:grid;grid-template-columns:1.6fr 1fr;gap:10px;margin:0 0 12px}
.tools .dates{display:grid;grid-template-columns:1fr 1fr;gap:10px;grid-column:1/-1}
@media(max-width:560px){.tools{grid-template-columns:1fr}.tools .dates{grid-template-columns:1fr 1fr}}
.tools input,.tools select{width:100%;padding:9px 11px;font:inherit;font-size:15px;color:var(--ink);
  background:var(--bg);border:1px solid var(--rule);border-radius:6px}
.count{font-size:13px;color:var(--muted);margin:0 0 10px;font-variant-numeric:tabular-nums}
.shown-of{font-size:13.5px;color:var(--ink2);margin:0 0 12px;padding:8px 12px;
  background:var(--bg);border-radius:6px;overflow-wrap:anywhere}
.shown-of:empty{display:none}
#hist-card select{width:100%;padding:9px 11px;font:inherit;font-size:14px;color:var(--ink);
  background:var(--bg);border:1px solid var(--rule);border-radius:6px;margin-top:5px}
.count b{color:var(--ink)}
.list{border:1px solid var(--rule);border-radius:8px;background:var(--card);overflow:hidden}

/* Рейтинг: место, имя, число совпадений и полоса относительной величины.
   Ради этого экрана всё и затевалось — «по кому больше всех», поэтому он крупный. */
.rank{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;
  padding:14px 16px;border-bottom:1px solid var(--rule)}
.rank:last-child{border-bottom:none}
.rank .place{font-variant-numeric:tabular-nums;font-size:15px;font-weight:600;color:var(--muted);
  text-align:center;line-height:32px;height:32px;border-radius:50%;background:var(--bg)}
.rank.top .place{background:var(--accent);color:#fff}
.rank.top .rname{color:var(--ink)}
.rname{font-size:16px;font-weight:600;color:var(--ink);overflow-wrap:anywhere}
.rsub{font-size:12.5px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums;
  overflow-wrap:anywhere}
.rsub a{color:var(--accent-ink);text-decoration:none;white-space:nowrap}
.rsub a:hover{text-decoration:underline}
.rbar{height:4px;border-radius:2px;background:var(--bg);margin-top:8px;overflow:hidden}
.rbar i{display:block;height:100%;background:var(--accent);opacity:.55}
.rank.top .rbar i{opacity:1}
.rcount{text-align:right;white-space:nowrap}
.rcount b{display:block;font-size:24px;font-weight:600;color:var(--ink);
  font-variant-numeric:tabular-nums;line-height:1.1}
.rcount span{font-size:11.5px;color:var(--muted)}

/* Сообщения: читаемым текстом, а не строкой таблицы. */
.msg-item{padding:14px 16px;border-bottom:1px solid var(--rule)}
.msg-item:last-child{border-bottom:none}
.msg-head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}
.msg-head .who2{font-weight:600;color:var(--ink);font-size:14.5px}
.msg-head .when{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.msg-head .open{margin-left:auto;font-size:13px;text-decoration:none}
.msg-text{font-size:15px;line-height:1.55;color:var(--ink2);white-space:pre-wrap;overflow-wrap:anywhere}
table.res{border-collapse:separate;border-spacing:0;width:100%;font-size:13.5px}
table.res th{position:sticky;top:0;z-index:1;background:var(--card);text-align:left;font-weight:600;
  font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
  padding:9px 10px;border-bottom:1px solid var(--rule);white-space:nowrap;cursor:pointer;user-select:none}
table.res th.plain{cursor:default}
table.res th span{color:var(--accent);margin-left:4px}
table.res td{padding:9px 10px;border-bottom:1px solid var(--rule);vertical-align:top;color:var(--ink2)}
table.res tr:last-child td{border-bottom:none}
table.res td.num{font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ink)}
table.res td.who{white-space:nowrap;color:var(--ink);font-weight:500}
table.res td.txt{min-width:260px;max-width:520px}
table.res td.txt div{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
table.res td.go a{text-decoration:none;font-size:15px}
.empty{padding:26px;text-align:center;color:var(--muted);font-size:14px}
.warnline{font-size:13px;color:var(--bad);margin:0 0 10px}
</style></head><body><div class="wrap">{% block body %}{% endblock %}</div></body></html>
